<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">PoolSync and native RDP clipboard: example route</title><desc id="desc">Example: desk-a connects by FreeRDP to a work-b graphical session. Native RDP owns the desk-a clipboard while detected; its local PoolSync selection polling and application pause, while mesh history and relays continue. The remote PoolSync agent distributes session copies to the other peers. Remmina is not directly detected.</desc><defs><marker id="end-087e87" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e87"/></marker><marker id="start-087e87" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#087e87"/></marker><marker id="end-7356c8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7356c8"/></marker><marker id="start-7356c8" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#7356c8"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1440" height="780" rx="0" fill="#f4f8fb" stroke="#f4f8fb"/><text x="55" y="65" font-size="40" fill="#10243a" font-weight="700" text-anchor="start">PoolSync + RDP</text><text x="55" y="107" font-size="24" fill="#52677c" font-weight="400" text-anchor="start">One native clipboard bridge, then the remote session joins the pool.</text><rect x="40" y="142" width="1360" height="75" rx="18" fill="#eaf1ff" stroke="#cddcf5"/><text x="65" y="176" font-size="19" fill="#10243a" font-weight="400" text-anchor="start">Fictitious example: desk-a → work-b. The same pattern can apply to desk-b and other participating remote sessions.</text><text x="65" y="202" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">RDP owns display / remote input; PoolSync owns the peer mesh. Actual RDP destinations may differ.</text><rect x="55" y="283" width="385" height="267" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="80" y="325" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">desk-a · local session :0</text><text x="80" y="362" font-size="22" fill="#7356c8" font-weight="600" text-anchor="start">FreeRDP client</text><text x="80" y="398" font-size="19" fill="#7356c8" font-weight="400" text-anchor="start">Native clipboard redirection</text><text x="80" y="440" font-size="18" fill="#087e87" font-weight="600" text-anchor="start">Local PoolSync clipboard paused</text><text x="80" y="473" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">History + peer relays continue</text><text x="80" y="511" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">KVM permission is unchanged</text><rect x="620" y="283" width="385" height="267" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="645" y="325" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">work-b · RDP session :10</text><text x="645" y="362" font-size="22" fill="#7356c8" font-weight="600" text-anchor="start">Native remote clipboard</text><text x="645" y="408" font-size="19" fill="#087e87" font-weight="600" text-anchor="start">PoolSync agent in this session</text><text x="645" y="443" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Publishes fresh session copies</text><text x="645" y="478" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Applies incoming pool copies</text><text x="645" y="511" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Clipboard only · no PoolSync KVM</text><path d="M 454 377 H 606" fill="none" stroke="#7356c8" stroke-width="3" marker-start="url(#start-7356c8)" marker-end="url(#end-7356c8)"/><text x="530" y="329" font-size="18" fill="#7356c8" font-weight="700" text-anchor="middle">Native RDP</text><text x="530" y="355" font-size="18" fill="#7356c8" font-weight="400" text-anchor="middle">clipboard</text><rect x="1100" y="283" width="285" height="267" rx="18" fill="#edf9f8" stroke="#c7e7e3"/><text x="1242" y="330" font-size="22" fill="#087e87" font-weight="700" text-anchor="middle">Other pool peers</text><text x="1242" y="380" font-size="22" fill="#10243a" font-weight="400" text-anchor="middle">desk-b</text><text x="1242" y="425" font-size="22" fill="#10243a" font-weight="400" text-anchor="middle">work-a</text><text x="1242" y="470" font-size="22" fill="#10243a" font-weight="400" text-anchor="middle">work-c</text><text x="1242" y="512" font-size="18" fill="#52677c" font-weight="400" text-anchor="middle">No central hub</text><path d="M 1020 408 H 1086" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><text x="1052" y="361" font-size="17" fill="#087e87" font-weight="700" text-anchor="middle">Mesh</text><rect x="55" y="585" width="1330" height="117" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="80" y="620" font-size="19" fill="#10243a" font-weight="700" text-anchor="start">WHY PAUSE THE LOCAL CLIPBOARD?</text><text x="80" y="651" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">Avoid two owners, clipboard echoes and older images replacing fresh copies.</text><text x="80" y="683" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Policy: pause_clipboard_when_rdp = true. Normal client closure lets local clipboard synchronization resume.</text><text x="55" y="740" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Detection: this user’s xfreerdp / xfreerdp3 processes. Remmina is not directly detected; native paste still needs testing.</text></g></svg>
