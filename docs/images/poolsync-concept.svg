<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">PoolSync: human–AI setup, hubless peer operation</title><desc id="desc">A human and an AI assistant configure PoolSync. desk-a and desk-b provide KVM and clipboard. work-a, work-b and work-c share clipboard only. Agents exchange encrypted data directly, with no permanent PoolSync coordinator. No VPN is needed on the same reachable LAN; a VPN is useful across different networks. Validate physical input on each desktop.</desc><defs><marker id="end-087e87" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e87"/></marker><marker id="start-087e87" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#087e87"/></marker><marker id="end-7356c8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7356c8"/></marker><marker id="start-7356c8" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#7356c8"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#f4f8fb" stroke="#f4f8fb"/><text x="55" y="65" font-size="43" fill="#10243a" font-weight="700" text-anchor="start">PoolSync</text><text x="55" y="106" font-size="25" fill="#52677c" font-weight="400" text-anchor="start">Fictitious example. Add, pause or retire authorized computers.</text><rect x="40" y="144" width="1360" height="137" rx="18" fill="#eaf1ff" stroke="#cddcf5"/><text x="65" y="182" font-size="20" fill="#7356c8" font-weight="700" text-anchor="start">01  SETUP · HUMAN + AI AGENT</text><text x="65" y="223" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">Human chooses</text><text x="65" y="255" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Computers · permissions · layout</text><text x="505" y="223" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">AI agent assists</text><text x="505" y="255" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Inspect · preserve keys · configure</text><text x="970" y="223" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">Together validate</text><text x="970" y="255" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Isolated tests · real desk · rollback</text><text x="454" y="234" font-size="28" fill="#7356c8" font-weight="400" text-anchor="start">→</text><text x="915" y="234" font-size="28" fill="#7356c8" font-weight="400" text-anchor="start">→</text><rect x="40" y="306" width="1360" height="540" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="65" y="347" font-size="20" fill="#087e87" font-weight="700" text-anchor="start">02  RUNTIME · LOCAL RUST AGENTS</text><text x="1370" y="347" font-size="18" fill="#52677c" font-weight="400" text-anchor="end">No AI assistant required at runtime</text><path d="M 444 457 H 994" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><path d="M 280 541 V 638" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><path d="M 1160 541 V 638" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><path d="M 444 719 H 554" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><path d="M 884 719 H 994" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><path d="M 393 541 L 615 639" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><path d="M 1047 541 L 825 639" fill="none" stroke="#087e87" stroke-width="3" marker-start="url(#start-087e87)" marker-end="url(#end-087e87)"/><text x="720" y="427" font-size="20" fill="#087e87" font-weight="600" text-anchor="middle">Authenticated + encrypted peer links</text><rect x="500" y="483" width="440" height="113" rx="18" fill="#edf9f8" stroke="#c7e7e3"/><text x="720" y="516" font-size="20" fill="#087e87" font-weight="600" text-anchor="middle">Clipboard · presence · screen layout</text><text x="720" y="548" font-size="18" fill="#10243a" font-weight="400" text-anchor="middle">Temporary KVM control between full nodes</text><text x="720" y="578" font-size="18" fill="#52677c" font-weight="400" text-anchor="middle">No permanent PoolSync hub or controller</text><rect x="125" y="389" width="310" height="145" rx="18" fill="#ffffff" stroke="#d7e3ec"/><rect x="125" y="407" width="5" height="109" rx="2" fill="#7356c8"/><rect x="147" y="411" width="40" height="28" rx="4" fill="#eef4fa" stroke="#7356c8"/><path d="M 167 439 v 9 m -12 0 h 24" stroke="#7356c8" stroke-width="2"/><text x="203" y="436" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">desk-a</text><text x="147" y="476" font-size="20" fill="#7356c8" font-weight="600" text-anchor="start">KVM + clipboard</text><text x="147" y="507" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Local graphical session · :0</text><rect x="1005" y="389" width="310" height="145" rx="18" fill="#ffffff" stroke="#d7e3ec"/><rect x="1005" y="407" width="5" height="109" rx="2" fill="#7356c8"/><rect x="1027" y="411" width="40" height="28" rx="4" fill="#eef4fa" stroke="#7356c8"/><path d="M 1047 439 v 9 m -12 0 h 24" stroke="#7356c8" stroke-width="2"/><text x="1083" y="436" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">desk-b</text><text x="1027" y="476" font-size="20" fill="#7356c8" font-weight="600" text-anchor="start">KVM + clipboard</text><text x="1027" y="507" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Local graphical session · :0</text><rect x="125" y="645" width="310" height="145" rx="18" fill="#ffffff" stroke="#d7e3ec"/><rect x="125" y="663" width="5" height="109" rx="2" fill="#087e87"/><rect x="147" y="667" width="40" height="28" rx="4" fill="#eef4fa" stroke="#087e87"/><path d="M 167 695 v 9 m -12 0 h 24" stroke="#087e87" stroke-width="2"/><text x="203" y="692" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">work-a</text><text x="147" y="732" font-size="20" fill="#087e87" font-weight="600" text-anchor="start">Clipboard only</text><text x="147" y="763" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Remote graphical session · :10</text><rect x="565" y="645" width="310" height="145" rx="18" fill="#ffffff" stroke="#d7e3ec"/><rect x="565" y="663" width="5" height="109" rx="2" fill="#087e87"/><rect x="587" y="667" width="40" height="28" rx="4" fill="#eef4fa" stroke="#087e87"/><path d="M 607 695 v 9 m -12 0 h 24" stroke="#087e87" stroke-width="2"/><text x="643" y="692" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">work-b</text><text x="587" y="732" font-size="20" fill="#087e87" font-weight="600" text-anchor="start">Clipboard only</text><text x="587" y="763" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Remote graphical session · :10</text><rect x="1005" y="645" width="310" height="145" rx="18" fill="#ffffff" stroke="#d7e3ec"/><rect x="1005" y="663" width="5" height="109" rx="2" fill="#087e87"/><rect x="1027" y="667" width="40" height="28" rx="4" fill="#eef4fa" stroke="#087e87"/><path d="M 1047 695 v 9 m -12 0 h 24" stroke="#087e87" stroke-width="2"/><text x="1083" y="692" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">work-c</text><text x="1027" y="732" font-size="20" fill="#087e87" font-weight="600" text-anchor="start">Clipboard only</text><text x="1027" y="763" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Remote graphical session · :10</text><text x="65" y="825" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Fictitious nodes and illustrative routes; the pool can grow or shrink. Layout is configured separately.</text><rect x="40" y="871" width="430" height="126" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="62" y="910" font-size="22" fill="#10243a" font-weight="700" text-anchor="start">Active node takes the lead</text><text x="62" y="946" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Physical use · authorized full node</text><text x="62" y="975" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Temporary 3-second control lease</text><rect x="505" y="871" width="430" height="126" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="527" y="910" font-size="22" fill="#10243a" font-weight="700" text-anchor="start">Take a computer away</text><text x="527" y="946" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Keep its identity and layout</text><text x="527" y="975" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Do not replay private copies</text><rect x="970" y="871" width="430" height="126" rx="18" fill="#ffffff" stroke="#d7e3ec"/><text x="992" y="910" font-size="22" fill="#10243a" font-weight="700" text-anchor="start">LAN or optional VPN</text><text x="992" y="946" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Same LAN: no VPN needed</text><text x="992" y="975" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Different networks: VPN is useful</text><text x="55" y="1040" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Examples illustrate the architecture, not a deployment inventory. Validate physical input for each real desk.</text></g></svg>
